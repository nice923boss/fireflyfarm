                                                <div key={i} className="h-40 rounded-xl overflow-hidden bg-cream-200 relative group border border-wood shadow-sm">
                                                    <img 
                                                        src={photoUrl} 
                                                        alt={photoTitle} 
                                                        onError={(e) => handleImgError(e, photo.keys, photo.fallback)}
                                                        className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" 
                                                    />
                                                    <div className="absolute bottom-2 left-2 right-2 bg-black/70 backdrop-blur text-white text-xs px-2.5 py-1 rounded-lg font-medium truncate">
                                                        {photoTitle}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="bg-cream p-4 rounded-2xl mb-6 border border-wood">
                                    <h4 className="font-serif font-bold text-forest-700 mb-2 text-sm">✨ 房型專屬設備清單</h4>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                        {roomModal.equipment.map((eq, i) => (
                                            <div key={i} className="text-xs text-coffee flex items-center">
                                                <span className="text-caramel mr-1.5 font-bold">✓</span> {eq}
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="flex justify-end space-x-3">
                                    <button onClick={() => setRoomModal(null)} className="px-5 py-2.5 rounded-xl border border-wood text-coffee text-sm hover:bg-cream">關閉</button>
                                    <a 
                                        href={lineUrl}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="px-6 py-2.5 rounded-xl bg-forest-700 text-white text-sm font-medium hover:bg-forest-800 inline-block">
                                        立即預約此房型
                                    </a>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Season Modal */}
                    {seasonModal && (
                        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-3xl w-full max-h-[90vh] overflow-y-auto p-6 sm:p-8 shadow-2xl">
                                <div className="flex justify-between items-start mb-4">
                                    <div>
                                        <span className="text-xs font-semibold text-caramel px-3 py-1 bg-cream-200 rounded-full">{seasonModal.period}</span>
                                        <h3 className="text-2xl font-serif font-bold text-forest-700 mt-2">{seasonModal.icon} {seasonModal.title}</h3>
                                    </div>
                                    <button onClick={() => setSeasonModal(null)} className="w-10 h-10 rounded-full bg-cream flex items-center justify-center text-coffee hover:bg-wood/20 transition-colors font-bold text-lg">✕</button>
                                </div>
                                <p className="text-coffee text-sm leading-relaxed mb-6">{seasonModal.desc}</p>
                                
                                <div className="mb-6">
                                    <h4 className="font-serif font-bold text-forest-700 mb-3 text-sm">📸 季節專屬寫真集</h4>
                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                        {seasonModal.gallery.map((photo, i) => (
                                            <div key={i} className="h-32 rounded-xl overflow-hidden bg-cream-200 relative group border border-wood">
                                                <img src={photo} alt={`${seasonModal.title} 照片 ${i+1}`} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
                                                <div className="absolute bottom-1 right-1 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded">寫真 #{i+1}</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="flex justify-end">
                                    <button onClick={() => setSeasonModal(null)} className="px-6 py-2.5 rounded-xl bg-forest-700 text-white text-sm font-medium hover:bg-forest-800">關閉分頁</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* EDM Modal */}
                    {edmModal && (
                        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 sm:p-8 shadow-2xl">
                                <div className="flex justify-between items-start mb-4">
                                    <div>
                                        <span className="text-xs font-semibold text-caramel px-3 py-1 bg-cream-200 rounded-full">專案企劃預覽</span>
                                        <h3 className="text-2xl font-serif font-bold text-forest-700 mt-2">📄 {edmModal.title}</h3>
                                    </div>
                                    <button onClick={() => setEdmModal(null)} className="w-10 h-10 rounded-full bg-cream flex items-center justify-center text-coffee hover:bg-wood/20 transition-colors font-bold text-lg">✕</button>
                                </div>
                                
                                <div className="bg-cream p-6 rounded-2xl border border-wood mb-6 space-y-4 text-sm text-coffee">
                                    {edmModal.type === 'corporate' ? (
                                        <>
                                            <p className="font-serif font-bold text-forest-700 text-base">🌲 企業 ESG 永續合作與年會場域方案</p>
                                            <p>飛螢農莊提供結合 OECM 生態保育、自然共生與團隊合作的深度體驗。我們協助企業將永續發展理念具現化，包含森林生態導覽、動手做共學體驗以及專業團體聚會空間。</p>
                                            <div className="bg-white p-4 rounded-xl border border-wood/60">
                                                <p className="font-semibold text-forest-700 mb-1">💰 企業專案報價參考：</p>
                                                <p className="text-xs">依據參訪人數、餐飲需求與半日/一日/兩天一夜行程客製化報價。歡迎透過官方 LINE 洽詢專屬企業專案。</p>
                                            </div>
                                        </>
                                    ) : (
                                        <>
                                            <p className="font-serif font-bold text-forest-700 text-base">🎒 學校戶外教學與食農教育課程專案</p>
                                            <p>給孩子最棒的戶外自然教室！我們提供竹筒飯DIY、夜探山林生態、手作餅乾及攀樹走繩等多樣化戶外教育體驗，讓學生在實際動手中理解土地與生態的價值。</p>
                                            <div className="bg-white p-4 rounded-xl border border-wood/60">
                                                <p className="font-semibold text-forest-700 mb-1">💰 學校團體課程報價參考：</p>
                                                <p className="text-xs">依學生年齡層與課程模組彈性調整，提供團體優惠方案。歡迎老師或校方與我們聯繫。</p>
                                            </div>
                                        </>
                                    )}

                                    <div className="h-48 bg-cream-200 rounded-xl flex items-center justify-center text-coffee text-xs italic border border-wood/40">
                                        （ 專案 EDM 圖片與精美排版・待補 ）
                                    </div>
                                </div>

                                <div className="flex justify-end space-x-3">
                                    <button onClick={() => setEdmModal(null)} className="px-5 py-2.5 rounded-xl border border-wood text-coffee text-sm hover:bg-cream">關閉</button>
                                    <a href={lineUrl} target="_blank" rel="noopener noreferrer" className="px-6 py-2.5 rounded-xl bg-forest-700 text-white text-sm font-medium hover:bg-forest-800 inline-flex items-center">
                                        洽詢專案與索取完整EDM
                                    </a>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
